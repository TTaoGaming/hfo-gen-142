name: fjsplib-reified-proof

on:
  push:
    branches: [roach/fjsplib-evo-r2-a25dbdca]
    paths:
      - 'experiments/fjsplib/prove_bound_reified_r6.py'
      - '.github/workflows/fjsplib-reified-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  target-124:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'ortools==9.15.6755'
      - name: Independent reified decision model
        run: >-
          python experiments/fjsplib/prove_bound_reified_r6.py
          --instance behnke48
          --target 124
          --seconds 900
          --workers 4
          --out behnke48-target124-reified.json
          | tee reified-bound.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: behnke48-reified-proof-${{ github.run_id }}
          path: |
            behnke48-target124-reified.json
            reified-bound.log
          retention-days: 30
