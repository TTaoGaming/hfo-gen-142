name: FJSPLib Crown Assay

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fjsplib-crown-assay.yml'
      - 'tools/fjsp_crown_worker.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  abz8-vdata-506:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned solver
        run: python -m pip install --quiet ortools==9.14.6206
      - name: Freeze public instance
        shell: bash
        run: |
          set -euo pipefail
          url='https://raw.githubusercontent.com/ScheduleOpt/benchmarks/7b3f6fb1384309bd4abca866fe3bef2993139b91/flexible-jobshop/instances/json/abz8_vdata.json'
          curl -fsSL "$url" -o "$RUNNER_TEMP/abz8_vdata.json"
          sha=$(sha256sum "$RUNNER_TEMP/abz8_vdata.json" | awk '{print $1}')
          cat > "$RUNNER_TEMP/task.json" <<EOF
          {"schema":"hfo.fjsp-crown-workitem.v1","work_id":"GEN142-FJSPLIB-ABZ8-506-R0","instance_url":"$url","instance_sha256":"$sha","target_makespan":506,"max_seconds":300,"workers":4,"seed":1}
          EOF
      - name: Run hard feasibility assay
        env:
          PYTHONUNBUFFERED: '1'
        run: python tools/fjsp_crown_worker.py "$RUNNER_TEMP/task.json" "$RUNNER_TEMP/fjsp-crown"
      - name: Upload crown evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fjsp-abz8-vdata-506-${{ github.run_id }}
          path: ${{ runner.temp }}/fjsp-crown/
          retention-days: 14
