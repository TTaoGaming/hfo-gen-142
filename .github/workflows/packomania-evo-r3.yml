name: Packomania Evo R3

on:
  push:
    branches:
      - roach/packomania-evo-r3-5f8f7e1b
    paths:
      - 'tools/packomania_evo_r3.py'
      - 'tools/packomania_verify_r3.py'
      - '.github/workflows/packomania-evo-r3.yml'

permissions:
  contents: read

jobs:
  evolve:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen donor runtime dependencies
        run: python -m pip install --quiet 'numpy>=2.0,<3' 'scipy>=1.14,<2'
      - name: Run bounded successive-halving producer
        env:
          PACKOMANIA_EVO_OUT: ${{ runner.temp }}/packomania-evo-r3
          PYTHONUNBUFFERED: '1'
        run: python tools/packomania_evo_r3.py
      - name: Preserve producer lineage and negative kills
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packomania-evo-r3-producer-${{ github.run_id }}
          path: ${{ runner.temp }}/packomania-evo-r3/
          retention-days: 14

  verify:
    needs: evolve
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Recover producer artifact
        uses: actions/download-artifact@v4
        with:
          name: packomania-evo-r3-producer-${{ github.run_id }}
          path: ${{ runner.temp }}/packomania-evo-r3
      - name: Independent frozen-geometry verification and packetization
        env:
          PACKOMANIA_EVO_OUT: ${{ runner.temp }}/packomania-evo-r3
          PYTHONUNBUFFERED: '1'
        run: python tools/packomania_verify_r3.py
      - name: Preserve verifier and any submission-ready packet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packomania-evo-r3-verified-${{ github.run_id }}
          path: ${{ runner.temp }}/packomania-evo-r3/
          retention-days: 14
